# Shared globals applied to every workflow (this whole file is optional).
# Safe to commit: it holds only ${VAR} placeholders, no secret values.
# Use block style — ${VAR} is invalid inside YAML flow { }.

# Reusable connections. Define a connection once here, then REFERENCE it from a
# workflow side (or leader-election) with `conn-ref: <name>` — a conn-ref side then
# carries ONLY its queue:/topic:. Connections with identical details collapse into
# one binder; the binder name derives from the connection name.
#
# Only connections you reference by name belong here. The workflows also use MANUAL
# (inline) connections written directly on the side — mq-core (reused across
# workflow-0/1/3) and edge-solace (single-use in workflow-3) — which need no entry
# below. Referenced here: prod-solace (reused everywhere) and mq-archive (used once).
connections:
  prod-solace:                            # referenced by wf 0,1,2 + leader-election
    solace:
      host: tcps://broker.internal:55443  # tcps:// => TLS
      msg-vpn: prod
      client-username: connector
      client-password: ${SOL_PASSWORD}
      key-alias: solace-client            # presence => mTLS (needs the keystore below)
      api-properties:                     # optional; verbatim -> solace.java.api-properties
        REAPPLY_SUBSCRIPTIONS: true
  mq-archive:                             # referenced once (workflow-2); its own binder
    mq:
      conn-name: mqhost-archive.internal(1414)
      queue-manager: QM_ARCHIVE
      channel: DSU.SVRCONN
      user: appuser
      password: ${MQ_ARCHIVE_PASSWORD}
      tls: true                           # TLS, but note: NO key-alias => server-auth only, no mTLS
      cipher: TLS_RSA_WITH_AES_256_CBC_SHA256

tls:
  truststore:
    file: ./certs/truststore.jks          # one shared truststore for Solace + MQ TLS
    password: ${TRUSTSTORE_PASSWORD}
    type: JKS
  keystore:
    file: ./certs/keystore.jks            # required only when a connection sets key-alias (mTLS)
    password: ${KEYSTORE_PASSWORD}
    type: JKS
logging:
  level:
    root: INFO
    com.solace.connector: INFO
management:
  port: 8090
  exposure: health,info,workflows
  health-show-details: always
security:
  enabled: true
  users:
    - name: healthcheck
      password: ${HEALTHCHECK_PASSWORD}
leader-election:
  mode: active_standby                    # standalone | active_active | active_standby
  queue: solmq-connector-mgmt             # exclusive management queue (active_* only)
  conn-ref: prod-solace                   # management session — must be a solace connection
  fail-over:                              # optional; emitted verbatim
    max-attempts: 5
    back-off-initial-interval: 1000
    back-off-max-interval: 10000
    back-off-multiplier: 1.5
solace-defaults:
  connect-retries: -1
  reconnect-retries: -1
