#     mount-path: /app/external/classpath/truststores   # fixed; a non-default value is rejected
#   libs:                                 # optional extra IBM MQ jars from a host dir
#     dir: ./libs                         # host dir bind-mounted to /app/external/libs
#     mount-path: /app/external/libs      # in-container mount (default; usually leave unset)

