spring:
  config:
    import: optional:configtree:/run/secrets/
  ssl:
    bundle:
      jks:
        mq-conn-1-bundle:
          truststore:
            location: ./certs/truststore.jks
            password: ${TRUSTSTORE_PASSWORD}
            type: JKS
          keystore:
            location: ./certs/keystore.jks
            password: ${KEYSTORE_PASSWORD}
            type: JKS
          key:
            alias: mq-client
        mq-archive-bundle:
          truststore:
            location: ./certs/truststore.jks
            password: ${TRUSTSTORE_PASSWORD}
            type: JKS
  cloud:
    stream:
      binders:
        mq-conn-1:
          type: jms
          environment:
            ibm:
              mq:
                queue-manager: QM_CORE
                channel: DSU.SVRCONN
                conn-name: mqhost-core.internal(1414)
                user: ${MQ_CONN_1_USER}
                password: ${MQ_CONN_1_PASSWORD}
                ssl-bundle: mq-conn-1-bundle
                additional-properties:
                  WMQ_SSL_CIPHER_SUITE: TLS_RSA_WITH_AES_256_CBC_SHA256
        prod-solace:
          type: solace
          environment:
            solace:
              java:
                host: tcps://broker.internal:55443
                msg-vpn: prod
                client-username: ${PROD_SOLACE_CLIENT_USERNAME}
                client-password: ${PROD_SOLACE_CLIENT_PASSWORD}
                connect-retries: -1
                reconnect-retries: -1
                api-properties:
                  SSL_VALIDATE_CERTIFICATE: true
                  SSL_TRUST_STORE: ./certs/truststore.jks
                  SSL_TRUST_STORE_PASSWORD: ${TRUSTSTORE_PASSWORD}
                  SSL_TRUST_STORE_FORMAT: JKS
                  SSL_KEY_STORE: ./certs/keystore.jks
                  SSL_KEY_STORE_PASSWORD: ${KEYSTORE_PASSWORD}
                  SSL_KEY_STORE_FORMAT: JKS
                  SSL_PRIVATE_KEY_ALIAS: solace-client
                  REAPPLY_SUBSCRIPTIONS: true
        mq-archive:
          type: jms
          environment:
            ibm:
              mq:
                queue-manager: QM_ARCHIVE
                channel: DSU.SVRCONN
                conn-name: mqhost-archive.internal(1414)
                user: ${MQ_ARCHIVE_USER}
                password: ${MQ_ARCHIVE_PASSWORD}
                ssl-bundle: mq-archive-bundle
                additional-properties:
                  WMQ_SSL_CIPHER_SUITE: TLS_RSA_WITH_AES_256_CBC_SHA256
        sol-conn-1:
          type: solace
          environment:
            solace:
              java:
                host: tcp://edge-broker.internal:55555
                msg-vpn: edge
                client-username: ${SOL_CONN_1_CLIENT_USERNAME}
                client-password: ${SOL_CONN_1_CLIENT_PASSWORD}
                connect-retries: -1
                reconnect-retries: -1
        undefined:
          type: undefined
      bindings:
        input-0:
          destination: CORE.ORDERS.OUT
          binder: mq-conn-1
        output-0:
          destination: orders/from-mq
          binder: prod-solace
        input-1:
          destination: Q.TO-MQ.EVENTS
          binder: prod-solace
        output-1:
          destination: EVENTS.IN
          binder: mq-conn-1
        input-2:
          destination: ARCHIVE.REPLAY.OUT
          binder: mq-archive
        output-2:
          destination: archive/from-mq
          binder: prod-solace
        input-3:
          destination: CORE.EVENTS.BROADCAST
          binder: mq-conn-1
        output-3:
          destination: events/from-mq
          binder: sol-conn-1
      jms:
        bindings:
          input-0:
            consumer:
              destination-type: queue
          output-1:
            producer:
              destination-type: queue
          input-2:
            consumer:
              destination-type: queue
          input-3:
            consumer:
              destination-type: topic
              durable-subscription-name: solmq-5a276dea-602d-581b-b6d1-1d30d60b7be9
solace:
  connector:
    workflows:
      0:
        enabled: true
      1:
        enabled: true
      2:
        enabled: true
      3:
        enabled: true
    security:
      enabled: true
      users:
        - name: healthcheck
          password: ${SECURITY_USER_HEALTHCHECK_PASSWORD}
        - name: solmq-status
          password: 0123456789abcdef0123456789abcdef
    management:
      leader-election:
        mode: active_standby
        fail-over:
          max-attempts: 5
          back-off-initial-interval: 1000
          back-off-max-interval: 10000
          back-off-multiplier: 1.5
      queue: solmq-connector-mgmt
      session:
        host: tcps://broker.internal:55443
        msg-vpn: prod
        client-username: ${LEADER_ELECTION_CLIENT_USERNAME}
        client-password: ${LEADER_ELECTION_CLIENT_PASSWORD}
        api-properties:
          SSL_VALIDATE_CERTIFICATE: true
          SSL_TRUST_STORE: ./certs/truststore.jks
          SSL_TRUST_STORE_PASSWORD: ${TRUSTSTORE_PASSWORD}
          SSL_TRUST_STORE_FORMAT: JKS
          SSL_KEY_STORE: ./certs/keystore.jks
          SSL_KEY_STORE_PASSWORD: ${KEYSTORE_PASSWORD}
          SSL_KEY_STORE_FORMAT: JKS
          SSL_PRIVATE_KEY_ALIAS: solace-client
management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,info,workflows,leaderelection
  endpoint:
    health:
      show-details: always
logging:
  level:
    root: INFO
    com.solace.connector: INFO
