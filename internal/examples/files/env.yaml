# Single config for the Solace PubSub+ Connector for IBM MQ. This whole file is
# safe to commit: it holds only ${VAR} placeholders, never secret values.
# Use block style throughout -- ${VAR} is invalid inside YAML flow { }.
#
# Top-level keys are the connector defaults applied to every workflow. The
# workflows:, kubernetes:, docker:, and podman: sections drive discovery and each
# deploy target. Relative paths (tls.*.file, libs.dir, values-file, workflows.dir)
# resolve relative to THIS file's directory, so the config is portable.

# ---- workflow discovery ------------------------------------------------------
workflows:
  dir: .                 # folder to scan (relative to this file, or absolute)
  file_pattern: "*"      # only the '*' wildcard; matches *.yaml/*.yml base names

# ---- connector defaults (shared by every workflow) ---------------------------
# Reusable connections. Define one here, then REFERENCE it from a workflow side
# (or leader-election) with `conn-ref: <name>` -- a conn-ref side then carries
# ONLY its queue:/topic:. Connections with identical details collapse into one
# binder; the binder name derives from the connection name.
#
# Only connections you reference by name belong here. The workflows also use
# MANUAL (inline) connections written directly on the side -- mq-core (reused
# across workflow-0/1/3) and edge-solace (single-use in workflow-3) -- which need
# no entry below. Referenced here: prod-solace (reused) and mq-archive (once).
connections:
  prod-solace:                            # referenced by wf 0,1,2 + leader-election
    solace:
      host: tcps://broker.internal:55443  # tcps:// -> TLS
      msg-vpn: prod
      client-username: connector
      client-password: ${SOL_PASSWORD}
      key-alias: solace-client            # presence -> mTLS (needs the keystore below)
      api-properties:                     # optional; verbatim -> solace.java.api-properties
        REAPPLY_SUBSCRIPTIONS: true
  mq-archive:                             # referenced once (workflow-2); its own binder
    mq:
      conn-name: mqhost-archive.internal(1414)
      queue-manager: QM_ARCHIVE
      channel: DSU.SVRCONN
      user: appuser
      password: ${MQ_ARCHIVE_PASSWORD}
      tls: true                           # TLS, but NO key-alias -> server-auth only, no mTLS
      cipher: TLS_RSA_WITH_AES_256_CBC_SHA256
      # key-alias: mq-client              # add for mTLS (client cert from the keystore below)
      # additional-properties:            # optional; verbatim -> ibm.mq.additional-properties
      #   com.ibm.mq.cfg.useIBMCipherMappings: false

tls:
  truststore:
    file: ./certs/truststore.jks          # one shared truststore for Solace + MQ TLS
    password: ${TRUSTSTORE_PASSWORD}
    type: JKS
  keystore:
    file: ./certs/keystore.jks            # required only when a connection sets key-alias (mTLS)
    password: ${KEYSTORE_PASSWORD}
    type: JKS
logging:
  level:
    root: INFO
    com.solace.connector: INFO
management:
  port: 8090
  exposure: health,info,workflows
  health-show-details: always
security:
  enabled: true
  users:
    - name: healthcheck
      password: ${HEALTHCHECK_PASSWORD}
leader-election:
  mode: active_standby                    # standalone | active_active | active_standby
  queue: solmq-connector-mgmt             # exclusive management queue (active_* only)
  conn-ref: prod-solace                   # management session -- must be a solace connection
  # solace:                               # ...or define the management session inline (instead of conn-ref)
  #   host: tcps://broker.internal:55443
  #   msg-vpn: prod
  #   client-username: connector
  #   client-password: ${SOL_PASSWORD}
  #   key-alias: solace-client
  fail-over:                              # optional; emitted verbatim
    max-attempts: 5
    back-off-initial-interval: 1000
    back-off-max-interval: 10000
    back-off-multiplier: 1.5
solace-defaults:
  connect-retries: -1
  reconnect-retries: -1

# ---- kubernetes target -------------------------------------------------------
# Used by `generate kubernetes` and `deploy/delete kubernetes`. Ignored elsewhere.
kubernetes:
  command: kubectl                        # or "oc", or "kubectl --context prod -n solace-connectors"
  deployment:
    name: solmq-connector                 # DNS-1123 label (suffixed -1, -2, ... when >20 workflows split)
    namespace: solace-connectors          # deploy also emits a `kind: Namespace` for it
    image: solace/solace-pubsub-connector-ibmmq:2.13.0
    replicas: 2                           # active_standby: 1 leader + standbys (standalone needs 1)
    resources:
      cpu: "1"
      memory: 1Gi
    timezone: Asia/Singapore
  service:
    enabled: true
    port: 8090
  # logging:                              # optional syslog shipping (udp | tcp)
  #   syslog:
  #     host: syslog.corp
  #     port: 514
  #     protocol: udp                     # tcp needs the logstash-logback-encoder jar (see libs)
  # libs:                                 # optional IBM MQ jars at /app/external/libs (pick ONE mode)
  #   pvc:                                # (a) a PersistentVolumeClaim holding the jars
  #     existing: jar-libs-pvc            #     ...one that already exists
  #     # create:                         #     ...or create an NFS-backed PV + PVC instead
  #     #   name: jar-libs-pvc
  #     #   storage: 1Gi                  #     default 1Gi
  #     #   nfs:
  #     #     server: nfs1.corp.example
  #     #     path: /solace-libs
  #   # download:                         # (b) ...or fetch the jars in an initContainer at pod start
  #   #   urls:
  #   #     - https://repo.example/mq/com.ibm.mq.allclient.jar
  #   #   image: busybox:1.37             #     default busybox:1.37 (needs wget)
  #   #   pvc: jar-libs-pvc               #     optional existing PVC to cache into; empty -> emptyDir
  secrets:                                # entirely optional
    credentials:                          # env-var Secret (envFrom)
      create:
        name: solmq-credentials
        source: env                       # read these vars from the environment at deploy time
        variables:                        # one per ${VAR} used across the workflows + defaults
          - SOL_PASSWORD                    # prod-solace (referenced)
          - MQ_CORE_PASSWORD                # mq-core (inline, workflow-0/1)
          - MQ_ARCHIVE_PASSWORD             # mq-archive (referenced, workflow-2)
          - EDGE_SOL_PASSWORD               # edge-solace (inline, workflow-3)
          - TRUSTSTORE_PASSWORD
          - KEYSTORE_PASSWORD
          - HEALTHCHECK_PASSWORD
        # source: file                    # ...or read the values from a dotenv/yaml file instead of env
        # values-file: ./secrets.env      #     required when source: file
      # existing: my-credentials          # ...or reference a pre-existing Secret instead of create
    stores:                               # truststore/keystore Secret (volume mount)
      create:
        name: solmq-tls                   # base64-embeds the .jks files from tls.*.file
      # existing: my-tls

# ---- docker target (compose) -------------------------------------------------
# Used by `generate docker` and `deploy/delete docker`. application.yml is
# inlined into the compose file; credentials become an env_file (0600).
docker:
  command: docker                         # or "docker --context foo"
  image: solace/solace-pubsub-connector-ibmmq:2.13.0
  name: solmq-connector
  restart: unless-stopped
  ports:
    - 8090                                # bare -> same host port (8090:8090)
    # - "8081:8090"                       # ...or "host:container" to map a distinct host port
  timezone: Asia/Singapore
  secrets:
    credentials:                          # rendered as an env_file; never logged
      create:
        name: solmq-credentials
        source: env
        variables:
          - SOL_PASSWORD
          - MQ_CORE_PASSWORD
          - MQ_ARCHIVE_PASSWORD
          - EDGE_SOL_PASSWORD
          - TRUSTSTORE_PASSWORD
          - KEYSTORE_PASSWORD
          - HEALTHCHECK_PASSWORD
      # existing: solmq-connector.env     # ...or reference an existing env-file by name
  stores:                                 # bind-mount tls.*.file into the container
    mount-path: /app/external/classpath/truststores
  # libs:
  #   dir: ./libs                         # host dir bind-mounted to /app/external/libs
  #   mount-path: /app/external/libs      # in-container mount (default; usually leave unset)

# ---- podman target -----------------------------------------------------------
# `generate podman` honours mode (run|quadlet); deploy/delete are always quadlet
# + systemctl. Scope auto-detects: root -> system, otherwise --user.
podman:
  command: podman
  mode: run                               # run (default) | quadlet -- controls `generate` only
  quadlet:
    scope: auto                           # auto | user | system
    dir: ""                               # overrides the default dir for the resolved scope
  image: solace/solace-pubsub-connector-ibmmq:2.13.0
  name: solmq-connector
  restart: unless-stopped
  ports:
    - 8090                                # bare -> same host port (8090:8090)
    # - "8081:8090"                       # ...or "host:container" to map a distinct host port
  timezone: Asia/Singapore
  secrets:
    credentials:                          # rendered as --env-file / EnvironmentFile=; never logged
      create:
        name: solmq-credentials
        source: env
        variables:
          - SOL_PASSWORD
          - MQ_CORE_PASSWORD
          - MQ_ARCHIVE_PASSWORD
          - EDGE_SOL_PASSWORD
          - TRUSTSTORE_PASSWORD
          - KEYSTORE_PASSWORD
          - HEALTHCHECK_PASSWORD
      # existing: solmq-connector.env
  stores:
    mount-path: /app/external/classpath/truststores
  # libs:
  #   dir: ./libs                         # host dir bind-mounted to /app/external/libs
  #   mount-path: /app/external/libs      # in-container mount (default; usually leave unset)
