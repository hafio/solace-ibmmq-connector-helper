# Golden fixture: exercises every branch (syslog + libs + both secrets active).
# Top-level keys are the connector defaults; kubernetes: carries the deploy set.
# Use block style throughout -- ${VAR} is invalid inside YAML flow { }.

workflows:
  dir: .
  file_pattern: "*"

# Reusable connections. Define a connection once here, then REFERENCE it from a
# workflow side (or leader-election) with `conn-ref: <name>` -- a conn-ref side
# then carries ONLY its queue:/topic:.
connections:
  prod-solace:                            # referenced by wf 0,1,2 + leader-election
    solace:
      host: tcps://broker.internal:55443  # tcps:// -> TLS
      msg-vpn: prod
      client-username: connector
      client-password-env: SOL_PASSWORD
      key-alias: solace-client            # presence -> mTLS (needs the keystore below)
      api-properties:                     # optional; verbatim -> solace.java.api-properties
        REAPPLY_SUBSCRIPTIONS: true
  mq-archive:                             # referenced once (workflow-2); its own binder
    mq:
      conn-name: mqhost-archive.internal(1414)
      queue-manager: QM_ARCHIVE
      channel: DSU.SVRCONN
      user: appuser
      password-env: MQ_ARCHIVE_PASSWORD
      tls: true                           # TLS, but NO key-alias -> server-auth only, no mTLS
      cipher: TLS_RSA_WITH_AES_256_CBC_SHA256
      # key-alias: mq-client              # add for mTLS (client cert from the keystore below)
      # additional-properties:            # optional; verbatim -> ibm.mq.additional-properties
      #   com.ibm.mq.cfg.useIBMCipherMappings: false

tls:
  truststore:
    file: ./certs/truststore.jks          # one shared truststore for Solace + MQ TLS
    password-env: TRUSTSTORE_PASSWORD
    type: JKS
  keystore:
    file: ./certs/keystore.jks            # required only when a connection sets key-alias (mTLS)
    password-env: KEYSTORE_PASSWORD
    type: JKS
logging:
  level:
    root: INFO
    com.solace.connector: INFO
management:
  port: 8090
  health-show-details: always
leader-election:
  mode: active_standby                    # standalone | active_active | active_standby
  queue: solmq-connector-mgmt             # exclusive management queue (active_* only)
  conn-ref: prod-solace                   # management session -- must be a solace connection
  # session:                              # ...or define the management session inline (instead of conn-ref)
  #   host: tcps://broker.internal:55443
  #   msg-vpn: prod
  #   client-username: connector
  #   client-password-env: SOL_PASSWORD
  #   key-alias: solace-client
  #   api-properties:                     # optional; verbatim -> session.api-properties
  #     REAPPLY_SUBSCRIPTIONS: true
  fail-over:                              # optional; emitted verbatim
    max-attempts: 5
    back-off-initial-interval: 1000
    back-off-max-interval: 10000
    back-off-multiplier: 1.5
# Merged into every Solace binder's solace.java.* AND into the leader-election
# management session: the connector documents session.* as the same interface.
solace-defaults:
  connect-retries: -1
  reconnect-retries: -1

# Deploy settings -- used by `generate`/`deploy`/`remove` when the platform
# resolves to kubernetes (`--platform kubernetes`, or the only section present).
# ---- image (one declaration, every platform) ---------------------------------
# repo is the REGISTRY HOST only; a Docker Hub namespace (solace/) is part of the
# repository path and belongs in name. tag is required -- an untagged image
# resolves to :latest, which pins nothing. A sha256: digest pins exactly.
# ---- container timezone (one declaration, every platform) --------------------
timezone: Asia/Singapore                  # -> the container's TZ env var

image:
  # repo: registry.internal:5000          # omit for Docker Hub
  name: solace/solace-pubsub-connector-ibmmq
  tag: 2.13.0
  # Only needed when kubernetes.secrets.image-pull.create builds the pull secret.
  # user: svc-puller                      # ...or user-env: REGISTRY_USER
  # pass-env: REGISTRY_PASSWORD           # ...or pass: <literal>, as with every other
  #                                       #    credential here. Prefer the -env form.

kubernetes:
  command: kubectl                        # or "oc", or "kubectl --context prod -n solace-connectors"
  deployment:
    name: solmq-connector                 # DNS-1123 label
    namespace: solace-connectors          # deploy also emits a `kind: Namespace` for it
    replicas: 2                           # active_standby: 1 leader + standbys (standalone needs 1)
    resources:
      cpu: "1"
      memory: 1Gi
  service:
    enabled: true
    port: 8090
  logging:
    syslog:
      host: syslog.corp.example
      port: 514
      protocol: udp
  libs:
    pvc:
      create:
        name: jar-libs-pvc
        storage: 1Gi
        nfs:
          server: nfs1.corp.example
          path: /solace-libs
      # existing: jar-libs-pvc            #     ...or a PVC that already holds the jars (instead of create)
    # download:                           #     ...or fetch jars in an initContainer at pod start (instead of pvc)
    #   urls:
    #     - https://repo.example/mq/com.ibm.mq.jakarta.client-9.4.4.0.jar
    #   image: busybox:1.37               #     default busybox:1.37 (needs wget)
    #   pvc: jar-libs-pvc                 #     optional existing PVC to cache into; empty -> emptyDir
  secrets:                                # entirely optional
    credentials:                          # Secret mounted at /run/secrets, one file per credential
      create:
        name: solmq-credentials           # the tool fills its keys from the credentials above
      # existing: my-credentials          # ...or mount a pre-existing Secret instead of creating one
    stores:                               # truststore/keystore Secret (volume mount)
      create:
        name: solmq-tls                   # base64-embeds the .jks files from tls.*.file
      # existing: my-tls

# ---- docker target (compose) -- shown commented; uncomment to enable `--platform docker` ----
# docker:
#   command: docker                       # or "docker --context foo"
#   name: solmq-connector                 # DNS-1123 label; compose service key / container_name
#   restart: unless-stopped
#   ports:
#     - 8090                              # bare -> same host port (8090:8090)
#     # - "8081:8090"                     # ...or "host:container" to map a distinct host port
#   # credentials need no configuration: they come from the connection
#   # fields above and are mounted at /run/secrets
