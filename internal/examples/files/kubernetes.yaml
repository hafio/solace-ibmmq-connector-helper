# Deploy settings — used by `solmq-gen deploy`, ignored by `config`.
# Override the filename with `-k`; it is never treated as a workflow.
deployment:
  name: solmq-connector                   # DNS-1123 label
  namespace: solace-connectors            # deploy also emits a `kind: Namespace` for it
  image: solace/solace-pubsub-connector-ibmmq:2.13.0
  replicas: 2                             # active_standby: 1 leader + standbys (standalone needs 1)
  resources:
    cpu: "1"
    memory: 1Gi
  timezone: Asia/Singapore
service:
  enabled: true
  port: 8090
# logging:                                # optional syslog shipping (udp | tcp)
#   syslog:
#     host: syslog.corp
#     port: 514
#     protocol: udp                       # tcp needs the logstash-logback-encoder jar (see libs)
# libs:                                   # optional IBM MQ jars at /app/external/libs (pick ONE mode)
#   pvc:
#     existing: jar-libs-pvc              # ...a PVC that already holds the jars
#   download:
#     urls:
#       - https://repo1.maven.org/maven2/com/ibm/mq/com.ibm.mq.allclient/9.4.3.0/com.ibm.mq.allclient-9.4.3.0.jar
secrets:                                  # entirely optional
  credentials:                            # env-var Secret (envFrom)
    create:
      name: solmq-credentials
      source: env                         # read these vars from the tool's environment at deploy time
      variables:                          # one per ${VAR} used across the workflows + defaults
        - SOL_PASSWORD                      # prod-solace (referenced)
        - MQ_CORE_PASSWORD                  # mq-core (inline, workflow-0/1)
        - MQ_ARCHIVE_PASSWORD               # mq-archive (referenced, workflow-2)
        - EDGE_SOL_PASSWORD                 # edge-solace (inline, workflow-3)
        - TRUSTSTORE_PASSWORD
        - KEYSTORE_PASSWORD
        - HEALTHCHECK_PASSWORD
    # existing: my-credentials            # ...or reference a pre-existing Secret instead of create
  stores:                                 # truststore/keystore Secret (volume mount)
    create:
      name: solmq-tls                     # base64-embeds the .jks files from defaults.yaml tls.*.file
    # existing: my-tls
